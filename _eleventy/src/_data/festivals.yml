title_ta: திருவிழாக்கள் & பூசைகள்
title_en: Festivals & Worship
items:
- month_ta: மாசி
  month_en: Masi<br>(Feb-Mar)
  title_ta: மகா சிவராத்திரி
  title_en: Maha Sivarathiri
  body_ta: ஒவ்வொரு ஆண்டும் தமிழ் மாதமான மாசியில் மகா சிவராத்திரி விழா சிறப்பாகக் கொண்டாடப்படுகிறது. அந்நாளில்
    இரவு முழுவதும் வழிபாடுகள் நடைபெற்று, அதிகாலை சிறப்பு பூஜை நடத்தப்படுகிறது.
  body_en: Maha Sivarathiri is celebrated grandly every year during the Tamil month of Masi, with worship
    continuing through the night and a special pooja at dawn.
- month_ta: ஆடி
  month_en: Aadi<br>(Jul-Aug)
  title_ta: ஆடி 18 — கன்னிமார் பூஜை & ஆடிப்பெருக்கு
  title_en: Aadi 18 — Kanniamman Festival & Aadi Perukku
  body_ta: ஆடி மாதம் 18ஆம் தேதி கன்னிமார் சாமிக்கு (சப்தகன்னிகள்) பலவித பதார்த்தங்களை படைத்து பூஜை செய்து,
    பெண் குழந்தைகள் மற்றும் சுமங்கலி பெண்களுக்கு துணிகளைக் கொடுத்து கன்னிமாரின் அருளினைப் பெறுவார்கள்.
    ஆடி மாதம் பெரும்பாலான சுற்றுப்புற கிராம மக்கள் புதன், ஞாயிறு கிழமைகளில் பொங்கல் வைத்து, படையல் இட்டு,
    கிடாய் வெட்டி பூஜை செய்து வழிபட்டு இறைவனின் திருவருள் பெறுவர். ஆடி மாதம் பூஜை செய்ய இயலாதவர்கள் புரட்டாசி,
    கார்த்திகை மற்றும் மார்கழி மாதங்களைத் தவிர்த்து மற்ற மாதங்களில் பூஜையினைச் செய்து நேர்த்திக் கடனை
    நிறைவேற்றுவார்கள்.
  body_en: On Aadi 18th, special pooja for Saptha Kannikal with various offerings. Cloth is given to girls
    and married women to receive the Kanniamman's blessings. Through Aadi, villagers from the surrounding
    area gather on Wednesdays and Sundays to cook Pongal and make traditional offerings. Those unable
    to worship during Aadi fulfil their vows in other months, avoiding Purattasi, Karthigai and Margazhi.
- month_ta: கார்த்திகை
  month_en: Karthigai<br>(Nov-Dec)
  title_ta: கார்த்திகை தீபம்
  title_en: Karthigai Deepam — Festival of Lights
  body_ta: கார்த்திகை மாதம் கார்த்திகை தீபத்தன்று தீபத்தூணில் மாலை ஆறு மணி அளவில் தீபம் ஏற்றி சிறப்பு
    பூஜை நடைபெறும்.
  body_en: During Karthigai month, a grand lamp is lit on the Deepa Pillar at 6 PM on Karthigai Deepam
    day, accompanied by special pooja celebrations.
- month_ta: மார்கழி
  month_en: Margazhi<br>(Dec-Jan)
  title_ta: மார்கழி 30 நாள் சிறப்பு பூஜை
  title_en: 30-Day Margazhi Special Worship
  body_ta: மார்கழி மாதம் 30 நாட்களும் அதிகாலை 6 மணிக்கு சிறப்பு கட்டளை பூஜை நடைபெறும். பக்தர்கள் தங்களுக்கு
    விருப்பமான அல்லது அவர்கள் பிறந்த நட்சத்திர நாட்களில் கட்டளையை ஏற்று பூஜையை சிறப்படைய செய்வார்கள்.
  body_en: All 30 days of Margazhi month feature special dawn pooja at 6 AM. Devotees can sponsor the
    pooja on their birth star days and receive divine blessings throughout this sacred month.
- month_ta: மாதாந்திர
  month_en: Monthly
  title_ta: சங்கடஹர சதுர்த்தி & அமாவாசை
  title_en: Sangadahara Chaturthi & Amavasai
  body_ta: ஒவ்வொரு மாதமும் சங்கடஹர சதுர்த்தி அன்று மாலை 6 மணி அளவில் வேம்பரசு விநாயகருக்கு அபிஷேக பூஜை
    அலங்கார பூஜை சிறப்பாக நடைபெறும். ஒவ்வொரு மாதமும் அமாவாசை அன்று திரளாக மக்கள் வந்து பூஜையில் கலந்து
    இறையருள் பெறுவார்கள்; அன்று மதியம் அன்னதானம் நடைபெறும்.
  body_en: Monthly Sangadahara Chaturthi at 6 PM with abhisheka and alankara pooja for Vemparasu Vinayakar.
    On every Amavasai (new moon), large crowds of devotees gather for worship and receive divine grace,
    followed by annadhanam (free community meal) at midday.
- month_ta: சிறப்பு
  month_en: Special<br>Days
  title_ta: தமிழ் புத்தாண்டு, தீபாவளி & தைப்பொங்கல்
  title_en: Tamil New Year, Deepavali & Thai Pongal
  body_ta: தமிழ் புத்தாண்டு, ஆடிப்பெருக்கு, தீபாவளி மற்றும் தைப்பொங்கல் திரு நாட்களில் சிறப்பு அலங்கார
    பூஜை நடைபெறும்.
  body_en: Grand decoration and special pooja ceremonies are held on Tamil New Year, Aadi Perukku, Deepavali,
    and Thai Pongal — the most auspicious days in the Tamil calendar.
