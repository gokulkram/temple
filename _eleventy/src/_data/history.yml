title_ta: வரலாறு
title_en: History & Heritage
entries:
- title_ta: பத்தொன்பதாம் நூற்றாண்டு
  title_en: 19th Century Origins
  body_ta: இக்கோயில் பத்தொன்பதாம் நூற்றாண்டைச் சேர்ந்தது. நீண்ட வரலாற்றுப் பின்னணியுடன் அன்னூர் கிராமத்தின்
    மையமாக விளங்குகிறது.
  body_en: This temple dates back to the 19th century and stands as the spiritual heart of Annur village.
    It is classified as a "Thirukkoyil" under the Hindu Religious and Charitable Endowments Department.
- title_ta: கோயில் அமைப்பு
  title_en: Temple Architecture
  body_ta: இக்கோயிலில் கருப்பராயன் சன்னதி மற்றும் கோபுரம் உள்ளது. நுழைவாயிலின் இடது புறம் கேரள அமைப்பில்
    கம்பீரமாக அமைக்கப்பட்ட கருவறையில் அருள்மிகு ஆனைமலை கருப்பராயர் வடக்கு நோக்கி வீற்றிருக்கிறார். கருப்பராயருக்கு
    நேர் எதிரில் பிரம்மாண்டமான யானை மற்றும் குதிரை சிலைகள் உள்ளன.
  body_en: The temple features a Gopuram and a main shrine designed in Kerala style. Lord Anaimalai Karupparayar
    is seated facing north in the sanctum on the left side of the entrance. Grand elephant and horse statues
    stand majestically in front of the deity — Karupparayar standing on the elephant's ambari is a breathtaking
    sight.
- title_ta: வேம்பரசு விநாயகர் & புனித மரங்கள்
  title_en: Vemparasu Vinayakar & Sacred Trees
  body_ta: நுழைவாயிலின் வலது புறம் தனித்துவமாக வேம்பரசு விநாயகர் சன்னதி தனி மேடையில் அமைந்துள்ளது. வேப்ப
    மரமும் அரச மரமும் அருகருகே அமைந்துள்ள மரங்களின் அடியில் விநாயகர் அமர்ந்திருப்பதால் வேம்பரசு விநாயகர்
    என்ற பெயர் பெற்றது. </p> <p> அரச மரமும் வேப்ப மரமும் இணைந்திருப்பது சிவசக்தியின் வெளிப்பாடு — அரசு
    சிவனாகவும், வேம்பு சக்தியாகவும் கருதப்படுவதால், இவ்விடம் தெய்வ சாந்நித்தியம் நிறைந்ததாகத் திகழ்கிறது.
    பிள்ளையாரையும் மரங்களையும் சுற்றி வழிபட்டு வருவோர்க்குச் சந்தான பாக்கியம் உண்டாகும் என்பது ஐதீகம்.
  body_en: On the right side of the entrance, the unique Vemparasu Vinayakar shrine sits on a separate
    raised platform. The deity is named "Vemparasu" because it sits beneath intertwined Neem (Vembu) and
    Peepal (Arasu) trees — a rare and sacred natural formation. The paired trees are held to embody Siva
    and Sakti, and devotees who circumambulate the trees and the shrine are traditionally believed to
    be blessed with children.
- title_ta: பிற சன்னதிகள்
  title_en: Other Shrines & Sculptures
  body_ta: கருப்பராயர் சுவாமிக்கு நேர் எதிர்ப்புறம் தெற்கு நோக்கி ஸ்ரீ மகா முனிஸ்வரர் இரட்டை முனிகளாக
    கம்பீரமாக வீற்றிருக்கின்றனர். கருப்பராயர் சன்னதிக்கு இடது புறமாக புற்றுடன் கூடிய நாகர் ஸ்தலமும், பல்லவர்
    காலத்து மதுரை வீரன் பொம்மி தேவி புடைப்பு சிலையும், சப்த கன்னிகள் மேடையும் உள்ளன.
  body_en: Directly opposite the main deity and facing south, Sri Maha Muniswarar sits as twin sages.
    Adjacent to Karupparayar's shrine are the Nagar Sthalam (snake shrine with anthill), a Pallava-era
    relief sculpture of Madhurai Veeran and Pommi Devi, and the Saptha Kannikal (Seven Maidens) platform.
