title_ta: வருகை தகவல்
title_en: Visitor Information
cards:
- icon: 🕐
  title_ta: கோயில் நேரம்
  title_en: Temple Timings
  body: '<span class="time">மாலை 5:00 மணி முதல்</span> Opens 5:00 PM (per Google Maps) <br><br> <em style="font-family:
    var(--font-body); opacity: 0.75;"> வருகைக்கு முன் கோயிலைத் தொடர்புகொண்டு நேரத்தை உறுதி செய்யவும்.<br>
    Please call ahead to confirm timings. </em>'
- icon: 🪔
  title_ta: பூசையும் தொடர்பும்
  title_en: Worship & Contact
  body: '<span class="time">ஒருகாலப் பூசை</span> இக்கோயிலில் ஒருகாலப் பூசை நடக்கின்றது. மார்கழி மாதம்
    30 நாட்களும் அதிகாலை 6 மணிக்குச் சிறப்புக் கட்டளைப் பூசை நடைபெறும். <span class="time"><a href="tel:+919843098927"
    style="color: inherit;">098430 98927</a></span> A single daily pooja is performed; during Margazhi,
    a special dawn pooja is held at 6 AM for all 30 days.'
- icon: 🙏
  title_ta: தரிசன குறிப்பு
  title_en: Darshan Guidelines
  body: 'கோயிலுக்கு வரும் பக்தர்கள் பாரம்பரிய ஆடை அணிந்து வருமாறு கேட்டுக்கொள்ளப்படுகிறார்கள். <br><br>
    <em style="font-family: var(--font-body); opacity: 0.7;"> Devotees are requested to wear traditional
    attire when visiting. </em>'
