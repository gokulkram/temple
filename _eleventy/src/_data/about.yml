title_ta: கோயில் பற்றி
title_en: About the Temple
paragraphs:
- ta: அன்னூர் ஆனைமலை கருப்பராயசுவாமி கோயில் தமிழ்நாட்டில் கோயம்புத்தூர் மாவட்டம், அன்னூர் என்னும் ஊரில்
    அமைந்துள்ள ஒரு கிராமக் கோயிலாகும்.
  en: The Annur Anaimalai Karupparayaswami Temple is a revered village temple situated in Annur, Coimbatore
    District, Tamil Nadu. This sacred shrine is dedicated to Lord Karupparayan, a powerful guardian deity
    deeply venerated across the Tamil countryside.
- ta: இக்கோயில் முதன்மைத் திருக்கோயில் என்ற வகைப்பாட்டில் இந்து அறநிலையத்துறையின் கட்டுப்பாட்டில் உள்ளது.
    பரம்பரை அல்லாத அறங்காவலர் அமைப்பால் நிர்வகிக்கப்படுகிறது.
  en: Classified as a "Thirukkoyil" (sacred temple), it is administered under the Hindu Religious and
    Charitable Endowments Department and managed by non-hereditary trustees (Arangavalars).
