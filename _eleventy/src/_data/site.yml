title_tag: அருள்மிகு ஆனைமலை கருப்பராயர் திருக்கோவில் | Arulmiku Anaimalai Karupparayar Temple, Annur
meta_description: அருள்மிகு ஆனைமலை கருப்பராயர் திருக்கோவில், அன்னூர், கோயம்புத்தூர் — கருப்பராயன், வேம்பரசு
  விநாயகர், மகா முனிஸ்வரர், சப்த கன்னிகள் சன்னதிகள். வரலாறு, திருவிழாக்கள், முகவரி மற்றும் தரிசன தகவல்.
  Arulmiku Anaimalai Karupparayar Temple, Annur, Coimbatore District, Tamil Nadu.
