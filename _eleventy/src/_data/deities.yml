title_ta: தெய்வங்கள்
title_en: Presiding Deities
cards:
- icon: ⚔
  name_ta: அருள்மிகு ஆனைமலை கருப்பராயர்
  name_en: Lord Anaimalai Karupparayar
  desc_ta: கோயிலின் மூலவர். கேரள அமைப்பில் கம்பீரமாக வடக்கு நோக்கி வீற்றிருக்கிறார். யானையின் மீது அம்பாரியில்
    கம்பீரமாக நின்றிருக்கும் கருப்பராயரை பார்ப்பதற்கே மெய்சிலிர்க்கும்.
  desc_en: The presiding deity, seated facing north in a Kerala-style shrine. A majestic sight atop the
    elephant's ambari with grand horse statues standing before him — a truly awe-inspiring vision.
- icon: 🐘
  name_ta: வேம்பரசு விநாயகர்
  name_en: Vemparasu Vinayakar
  desc_ta: வேப்ப மரமும் அரச மரமும் அருகருகே அமைந்துள்ள மரங்களின் அடியில் தனி மேடையில் அமர்ந்திருப்பதால்
    வேம்பரசு விநாயகர் என்ற பெயர் பெற்றது.
  desc_en: Named "Vemparasu" as the deity sits beneath intertwined Neem (Vembu) and Peepal (Arasu) trees
    on a raised platform at the entrance's right side.
- icon: 🔱
  name_ta: ஸ்ரீ மகா முனிஸ்வரர்
  name_en: Sri Maha Muniswarar
  desc_ta: கருப்பராயருக்கு நேர் எதிர்ப்புறம் தெற்கு நோக்கி இரட்டை முனிகளாக கம்பீரமாக வீற்றிருக்கின்றனர்.
  desc_en: Seated directly opposite the main deity and facing south as twin sages, Sri Maha Muniswarar
    is a revered presence in the temple complex.
- icon: 🐍
  name_ta: நாகர் ஸ்தலம்
  name_en: Nagar Sthalam
  desc_ta: கருப்பராயர் சன்னதிக்கு இடது புறமாக புற்றுடன் கூடிய நாகர் ஸ்தலம் அமைந்துள்ளது.
  desc_en: The sacred snake shrine with an anthill, located to the left of the Karupparayar sanctum.
- icon: 🗡
  name_ta: மதுரை வீரன் & பொம்மி தேவி
  name_en: Madhurai Veeran & Pommi Devi
  desc_ta: பல்லவர் காலத்து புடைப்பு சிற்பமாக மதுரை வீரன் பொம்மி தேவி சிலை அமைந்துள்ளது.
  desc_en: A Pallava-era relief sculpture depicting Madhurai Veeran and Pommi Devi — an ancient artistic
    heritage of the temple.
- icon: 👸
  name_ta: சப்த கன்னிகள்
  name_en: Saptha Kannikal
  desc_ta: கன்னிமார் என்று சொல்லக்கூடிய சப்த கன்னிகள் மேடை உள்ளது. ஆடி 18ஆம் தேதி சிறப்பு பூஜை நடைபெறும்.
  desc_en: The Seven Maidens platform — a special pooja is held on Aadi 18th with offerings and cloth
    given to girls and women devotees.
