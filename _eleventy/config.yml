# Sveltia CMS — schema for the Anaimalai Karupparayar temple site.
# Every field here maps to a value in src/_data/*.yml, which Eleventy renders
# into index.html. Editing here commits to GitHub and rebuilds the site.

backend:
  name: github
  repo: REPLACE-WITH/GITHUB-REPO   # e.g. stallioni/anaimalai-temple
  branch: main
  commit_messages:
    update: 'content: update {{collection}}'
    uploadMedia: 'content: upload {{path}}'
    deleteMedia: 'content: delete {{path}}'

# Uploaded photos land next to the ones already in the repo.
media_folder: images
public_folder: images

media_libraries:
  default:
    config:
      max_file_size: 5242880   # 5 MB — reject oversized phone photos outright
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600

# Shown to the editor above the entry list.
site_url: /
display_url: /
logo_url: /images/hero-karupparayar.jpg

collections:
  # ---------------------------------------------------------------- SITE
  - name: site
    label: 'தள அமைப்புகள் / Site Settings'
    files:
      - name: site
        label: 'பொது தகவல் / General'
        file: src/_data/site.yml
        icon: settings
        fields:
          - { name: title_tag, label: 'உலாவி தலைப்பு / Browser title', widget: string }
          - { name: meta_description, label: 'Google விளக்கம் / Search description', widget: text,
              hint: 'Shown under the page title in Google results. Keep under ~160 characters.' }
          - { name: og_site_name, label: 'தள பெயர் / Site name (social)', widget: string }
          - { name: og_title, label: 'பகிர்வு தலைப்பு / Share title', widget: string }
          - { name: og_description, label: 'பகிர்வு விளக்கம் / Share description', widget: text }
          - { name: twitter_description, label: 'Twitter விளக்கம் / Twitter description', widget: text }
          - { name: og_url, label: 'தள முகவரி / Site URL', widget: string,
              hint: 'Must be the full https:// address, or WhatsApp previews break.' }
          - { name: og_image, label: 'பகிர்வு படம் / Share image URL', widget: string,
              hint: 'Full https:// address of the image shown when the link is shared.' }
          - { name: brand_ta, label: 'மேல்பட்டி பெயர் / Header name', widget: text,
              hint: 'Use <br> to break the line.' }
          - { name: phone_display, label: 'தொலைபேசி (காட்சி) / Phone shown', widget: string }
          - { name: phone_link, label: 'தொலைபேசி (இணைப்பு) / Phone dial link', widget: string,
              hint: 'International format, e.g. +919843098927' }
          - { name: latitude, label: 'அட்சரேகை / Latitude', widget: string }
          - { name: longitude, label: 'தீர்க்கரேகை / Longitude', widget: string }

      - name: nav
        label: 'மெனு / Navigation'
        file: src/_data/nav.yml
        icon: menu
        fields:
          - name: links
            label: 'மெனு இணைப்புகள் / Menu links'
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: 'பெயர் / Label', widget: string }
              - { name: href, label: 'இணைப்பு / Anchor', widget: string,
                  hint: 'Must start with # — e.g. #about' }

      - name: footer
        label: 'அடிப்பகுதி / Footer'
        file: src/_data/footer.yml
        icon: vertical_align_bottom
        fields:
          - { name: temple_name, label: 'கோயில் பெயர் / Temple name', widget: string }
          - { name: location, label: 'இடம் / Location', widget: string }
          - { name: credits_html, label: 'ஆதாரங்கள் / Credits', widget: text,
              hint: 'HTML links are allowed here.' }
          - { name: copyright, label: 'பதிப்புரிமை / Copyright', widget: string }

  # ---------------------------------------------------------------- PAGE
  - name: page
    label: 'பக்கப் பகுதிகள் / Page Sections'
    files:
      - name: hero
        label: 'முதல் பகுதி / Hero'
        file: src/_data/hero.yml
        icon: photo
        fields:
          - { name: image, label: 'படம் / Image', widget: image }
          - { name: image_alt, label: 'பட விளக்கம் / Image description', widget: string,
              hint: 'Describes the photo for screen readers and Google.' }
          - { name: title_ta, label: 'தலைப்பு (தமிழ்)', widget: text, hint: 'Use <br> to break the line.' }
          - { name: title_en, label: 'Title (English)', widget: string }
          - { name: subtitle_ta, label: 'உபதலைப்பு (தமிழ்)', widget: string }
          - { name: subtitle_en, label: 'Subtitle (English)', widget: string }
          - { name: scroll_hint, label: 'கீழே உருட்டு குறிப்பு / Scroll hint', widget: string }

      - name: about
        label: 'கோயில் பற்றி / About'
        file: src/_data/about.yml
        icon: info
        fields:
          - { name: title_ta, label: 'தலைப்பு (தமிழ்)', widget: string }
          - { name: title_en, label: 'Title (English)', widget: string }
          - name: paragraphs
            label: 'பத்திகள் / Paragraphs'
            widget: list
            summary: '{{fields.ta}}'
            fields:
              - { name: ta, label: 'தமிழ்', widget: text }
              - { name: en, label: 'English', widget: text }
          - name: info_rows
            label: 'தகவல் அட்டவணை / Info table'
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: 'தலைப்பு / Label', widget: string }
              - { name: value_ta, label: 'மதிப்பு (தமிழ்)', widget: string }
              - { name: value_en, label: 'Value (English)', widget: string, required: false }

      - name: history
        label: 'வரலாறு / History'
        file: src/_data/history.yml
        icon: history_edu
        fields:
          - { name: title_ta, label: 'தலைப்பு (தமிழ்)', widget: string }
          - { name: title_en, label: 'Title (English)', widget: string }
          - name: entries
            label: 'பதிவுகள் / Entries'
            widget: list
            summary: '{{fields.title_ta}}'
            fields:
              - { name: title_ta, label: 'தலைப்பு (தமிழ்)', widget: string }
              - { name: title_en, label: 'Title (English)', widget: string }
              - { name: body_ta, label: 'விவரம் (தமிழ்)', widget: text }
              - { name: body_en, label: 'Description (English)', widget: text }

      - name: deities
        label: 'தெய்வங்கள் / Deities'
        file: src/_data/deities.yml
        icon: temple_hindu
        fields:
          - { name: title_ta, label: 'தலைப்பு (தமிழ்)', widget: string }
          - { name: title_en, label: 'Title (English)', widget: string }
          - name: cards
            label: 'தெய்வ அட்டைகள் / Deity cards'
            widget: list
            summary: '{{fields.icon}}  {{fields.name_ta}}'
            fields:
              - { name: icon, label: 'சின்னம் / Icon', widget: string,
                  hint: 'A single emoji, e.g. 🔱' }
              - { name: name_ta, label: 'பெயர் (தமிழ்)', widget: string }
              - { name: name_en, label: 'Name (English)', widget: string }
              - { name: desc_ta, label: 'விவரம் (தமிழ்)', widget: text }
              - { name: desc_en, label: 'Description (English)', widget: text }

      - name: festivals
        label: 'திருவிழாக்கள் / Festivals'
        file: src/_data/festivals.yml
        icon: celebration
        fields:
          - { name: title_ta, label: 'தலைப்பு (தமிழ்)', widget: string }
          - { name: title_en, label: 'Title (English)', widget: string }
          - name: items
            label: 'விழாக்கள் / Festival entries'
            widget: list
            summary: '{{fields.month_ta}} — {{fields.title_ta}}'
            fields:
              - { name: month_ta, label: 'மாதம் (தமிழ்)', widget: string }
              - { name: month_en, label: 'Month (English)', widget: string,
                  hint: 'Use <br> for a second line, e.g. Masi<br>(Feb-Mar)' }
              - { name: title_ta, label: 'விழா பெயர் (தமிழ்)', widget: string }
              - { name: title_en, label: 'Festival name (English)', widget: string }
              - { name: body_ta, label: 'விவரம் (தமிழ்)', widget: text }
              - { name: body_en, label: 'Description (English)', widget: text }

      - name: location
        label: 'இடம் / Location'
        file: src/_data/location.yml
        icon: location_on
        fields:
          - { name: title_ta, label: 'தலைப்பு (தமிழ்)', widget: string }
          - { name: title_en, label: 'Title (English)', widget: string }
          - name: info_items
            label: 'இட விவரங்கள் / Location details'
            widget: list
            summary: '{{fields.icon}}  {{fields.label}}'
            fields:
              - { name: icon, label: 'சின்னம் / Icon', widget: string }
              - { name: label, label: 'தலைப்பு / Label', widget: string }
              - { name: value_ta, label: 'மதிப்பு (தமிழ்)', widget: text,
                  hint: 'HTML links are allowed here.' }
              - { name: value_en, label: 'Value (English)', widget: text, required: false }

      - name: visit
        label: 'வருகை தகவல் / Visitor Info'
        file: src/_data/visit.yml
        icon: schedule
        fields:
          - { name: title_ta, label: 'தலைப்பு (தமிழ்)', widget: string }
          - { name: title_en, label: 'Title (English)', widget: string }
          - name: cards
            label: 'அட்டைகள் / Cards'
            widget: list
            summary: '{{fields.icon}}  {{fields.title_ta}}'
            fields:
              - { name: icon, label: 'சின்னம் / Icon', widget: string }
              - { name: title_ta, label: 'தலைப்பு (தமிழ்)', widget: string }
              - { name: title_en, label: 'Title (English)', widget: string }
              - { name: body, label: 'உள்ளடக்கம் / Content', widget: text,
                  hint: 'HTML is allowed: <br>, <span class="time">…</span>, <em>…</em>' }

  # ---------------------------------------------------------------- GALLERY
  - name: gallery
    label: 'கோயில் படங்கள் / Gallery'
    files:
      - name: gallery
        label: 'படத்தொகுப்பு / Photo gallery'
        file: src/_data/gallery.yml
        icon: photo_library
        fields:
          - { name: title_ta, label: 'தலைப்பு (தமிழ்)', widget: string }
          - { name: title_en, label: 'Title (English)', widget: string }
          - name: photos
            label: 'படங்கள் / Photos'
            widget: list
            summary: '{{fields.label}}'
            hint: 'Drag to reorder. The order here is the order on the page.'
            fields:
              - { name: image, label: 'படம் / Photo', widget: image }
              - { name: label, label: 'குறுந்தலைப்பு / Short label', widget: string,
                  hint: 'Shown over the photo on hover.' }
              - { name: caption, label: 'விளக்கம் / Caption', widget: string,
                  hint: 'Shown in the enlarged view, and read by screen readers.' }
